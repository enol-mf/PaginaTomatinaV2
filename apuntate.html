<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomatina - ¡Apúntate!</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container-fluid p-3 d-flex flex-column gap-3">
      <nav class="navbar navbar-expand-lg ">
        <div class="container-fluid text-center">
          <div>
            <a class="navbar-brand text-tomate-piel" href="index.html"
              >Inicio</a
            >
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
          </div>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active text-tomate-piel"
                  href="historia.html"
                >
                  Historia
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link text-tomate-piel" href="comoir.html">Como ir</a>
              </li>

              <li class="nav-item">
                <a class="nav-link text-tomate-piel" href="normas.html"
                  >Normas</a
                >
              </li>

              <li class="nav-item">
                <a class="nav-link text-tomate-piel" href="apuntate.html"
                  >¡Apuntate!</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <div class="container-fluid">
        <div class="row align-items-center">
          <!-- Columna Izquierda: Imagen -->
          <div class="col-lg-3 d-none d-lg-block">
            <img src="images/apuntate.jpg" class="img-fluid" alt="Apúntate 1">
          </div>

          <!-- Columna Central: Formulario -->
          <div class="col-lg-6">
            <div class="row text-center mb-2">
              <h2 class="text-tomate-piel">¡Inscríbete en la aventura!</h2>
              <p class="text-muted">Rellena el formulario para gestionar tu plaza en el evento.</p>
            </div>

            <div class="card p-4 shadow-sm">
              <form onsubmit="return false;">
                <div class="mb-3">
                  <label for="nombre" class="form-label text-tomate-piel fw-bold">Nombre</label>
                  <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="mb-3">
                  <label for="apellidos" class="form-label text-tomate-piel fw-bold">Apellidos</label>
                  <input type="text" class="form-control" id="apellidos" placeholder="Tus apellidos" required>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label text-tomate-piel fw-bold">Correo Electrónico</label>
                  <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="mb-3">
                  <label for="origen" class="form-label text-tomate-piel fw-bold">¿De dónde vas a ir?</label>
                  <input type="text" class="form-control" id="origen" placeholder="Ciudad de origen (ej. Madrid, Barcelona...)" required>
                </div>

                <div class="mb-3">
                  <label for="opciones" class="form-label text-tomate-piel fw-bold">¿Qué necesitas?</label>
                  <select class="form-select" id="opciones" required>
                    <option value="" disabled selected>Selecciona una opción...</option>
                    <option value="transporte">Solo transporte</option>
                    <option value="estancia">Solo estancia</option>
                    <option value="transporte_estancia">Transporte + Estancia</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="infoAdicional" class="form-label text-tomate-piel fw-bold">Información adicional</label>
                  <textarea class="form-control" id="infoAdicional" rows="2" placeholder="Cuéntanos cualquier detalle relevante..."></textarea>
                </div>

                <div class="text-center mt-2">
                  <button type="button" class="btn btn-danger px-5 py-2 fw-bold" style="background-color: var(--bs-red, #dc3545);">
                    Enviar solicitud
                  </button>
                </div>
              </form>
            </div>
          </div>


          <div class="col-lg-3 d-none d-lg-block">
            <img src="images/apuntate2.jpg" class="img-fluid" alt="Apúntate 2">
          </div>
        </div>
      </div>

      <div style="height: 50px;"></div>
      <div class="row mb-0">
        <p class="text-center text-tomate-piel">
          Pagina de la tomatina creada para proyecto de Diseño de Interfaces Web
        </p>
      </div>
    </div>
  </body>
</html>
